<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Агентства — Рынок недвижимости Беларуси</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="brand">Рынок недвижимости<br>Беларуси</div>
    <div class="brand-sub">Официальный реестр</div>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav"></nav>
  <div class="sidebar-footer"><div class="stamp"></div></div>
</aside>

<main class="main">
  <header class="page-header">
    <div class="ph-left">
      <div>
        <div class="ph-title">Агентства</div>
        <div class="ph-sub" id="ph-sub"></div>
      </div>
    </div>
    <div class="ph-actions">
      <button class="btn-icon" onclick="toggleTheme()" id="theme-btn"></button>
    </div>
  </header>

  <div class="content fade-in">
    <!-- Filters -->
    <div class="filters-bar">
      <div class="filter-group">
        <div class="filter-label">Поиск</div>
        <input class="filter-input" type="text" id="f-search" placeholder="Название или УНП…" oninput="onSearch()">
      </div>
      <div class="filter-group">
        <div class="filter-label">Регион</div>
        <select class="filter-select" id="f-region" onchange="render()">
          <option value="">Все регионы</option>
          <option value="MINSK">Минск</option>
          <option value="BREST">Брест и обл.</option>
          <option value="VITEBSK">Витебск и обл.</option>
          <option value="GOMEL">Гомель и обл.</option>
          <option value="GRODNO">Гродно и обл.</option>
          <option value="MINSK_REGION">Минская обл.</option>
          <option value="MOGILEV">Могилев и обл.</option>
        </select>
      </div>
      <div class="filter-group">
        <div class="filter-label">Статус</div>
        <select class="filter-select" id="f-status" onchange="render()">
          <option value="">Все статусы</option>
          <option value="ACTIVE">Действует</option>
          <option value="REVOKED">Прекращена</option>
        </select>
      </div>
      <div class="filter-group">
        <div class="filter-label">Сортировка</div>
        <select class="filter-select" id="f-sort" onchange="render()">
          <option value="date-desc">Сначала новые</option>
          <option value="date-asc">Сначала старые</option>
          <option value="name-asc">А — Я</option>
          <option value="name-desc">Я — А</option>
        </select>
      </div>
      <div class="filters-right">
        <span class="results-cnt" id="results-cnt"></span>
        <button class="btn btn-outline btn-sm" onclick="clearFilters()">Сбросить</button>
      </div>
    </div>

    <!-- Grid -->
    <div class="agency-grid" id="agency-grid"></div>
    <div id="pagination"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
initTheme();
renderNav('agencies');

const { agencies, realtors } = getData();
let page = 1;
const PAGE_SIZE = 12;

// Pre-read status filter from URL
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('status')) {
  document.getElementById('f-status').value = urlParams.get('status');
}

function getFiltered() {
  const q      = document.getElementById('f-search').value.toLowerCase().trim();
  const region = document.getElementById('f-region').value;
  const status = document.getElementById('f-status').value;
  const sort   = document.getElementById('f-sort').value;

  let list = agencies.filter(a => {
    if (q && !a.name.toLowerCase().includes(q) && !a.unp.includes(q)) return false;
    if (region && a.region !== region) return false;
    if (status && a.status !== status) return false;
    return true;
  });

  list.sort((a, b) => {
    if (sort === 'date-desc') return new Date(b.licenseDate) - new Date(a.licenseDate);
    if (sort === 'date-asc')  return new Date(a.licenseDate) - new Date(b.licenseDate);
    if (sort === 'name-asc')  return a.name.localeCompare(b.name, 'ru');
    if (sort === 'name-desc') return b.name.localeCompare(a.name, 'ru');
    return 0;
  });
  return list;
}

function render() {
  const filtered = getFiltered();
  document.getElementById('results-cnt').textContent = `${filtered.length} агентств`;
  document.getElementById('ph-sub').textContent = `Всего: ${agencies.length} · Показано: ${filtered.length}`;

  const pageData = paginate(filtered, page, PAGE_SIZE);

  if (!pageData.length) {
    document.getElementById('agency-grid').innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <svg viewBox="0 0 24 24">${ICONS.building}</svg>
        <p>Агентства не найдены. Попробуйте изменить фильтры.</p>
      </div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  document.getElementById('agency-grid').innerHTML = pageData.map(a => {
    const realtorCount = realtors.filter(r => r.agencyId === a.id).length;
    return `
    <a href="agency.html?id=${a.id}" class="agency-card" style="text-decoration:none">
      <div class="agency-av">${initials(a.name)}</div>
      <div style="min-width:0">
        <div class="agency-name">${a.name}</div>
        <div class="badges">
          ${statusBadge(a.status)}
          ${regionBadge(a.region)}
        </div>
        <div class="agency-meta">
          УНП: ${a.unp}
          ${realtorCount ? ` · ${realtorCount} риэлт.` : ''}
        </div>
      </div>
    </a>`;
  }).join('');

  renderPagination(document.getElementById('pagination'), filtered.length, page, PAGE_SIZE, 'goPage');
}

window.goPage = function(p) { page = p; render(); window.scrollTo(0,0); };

const onSearch = debounce(() => { page = 1; render(); }, 250);

function clearFilters() {
  document.getElementById('f-search').value = '';
  document.getElementById('f-region').value = '';
  document.getElementById('f-status').value = '';
  document.getElementById('f-sort').value = 'date-desc';
  page = 1;
  render();
}

render();
</script>
</body>
</html>
